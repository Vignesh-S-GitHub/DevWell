<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 72" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="pulse-illustration" role="img" aria-label="Food animated instrument" data-illustration="food"><style>svg{color:#9cafff}.art-trace{stroke-dasharray:180;animation:trace 6s ease-in-out infinite}.art-signal{animation:signal 6s ease-in-out infinite}.art-bar{transform-box:fill-box;transform-origin:center bottom;animation:bars 6s ease-in-out infinite}.art-bar:nth-of-type(2){animation-delay:-2s}.art-bar:nth-of-type(3){animation-delay:-4s}.art-steam{stroke-dasharray:none;animation:steam 4s ease-out infinite}@keyframes trace{0%,8%{stroke-dashoffset:180;opacity:.35}45%,85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:.35}}@keyframes signal{0%,100%{opacity:.55}50%{opacity:1}}@keyframes bars{0%,100%{transform:scaleY(.82);opacity:.6}50%{transform:scaleY(1);opacity:1}}@keyframes steam{0%{transform:translateY(3px);opacity:0}30%{opacity:.8}100%{transform:translateY(-5px);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="m15 15 4 45h25l4-45Z" fill="var(--surface-2,#1a2030)" stroke="var(--line,#2a3244)"/><path class="art-trace" d="m15 15 4 45h25l4-45M19 15h25" stroke="var(--accent,#9cafff)"/><path class="art-signal" d="M20 41q7-4 13 0t11 0" stroke="var(--accent,#9cafff)"/><ellipse cx="69" cy="52" rx="16" ry="8" stroke="var(--line,#2a3244)"/><ellipse cx="69" cy="51" rx="10" ry="4" stroke="var(--accent,#9cafff)"/><path class="art-trace art-steam" d="M65 34v-8m8 8V22" stroke="var(--accent,#9cafff)"/></svg>
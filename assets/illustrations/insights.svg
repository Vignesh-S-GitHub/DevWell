<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 72" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="pulse-illustration" role="img" aria-label="Insights animated instrument" data-illustration="insights"><style>svg{color:#9cafff}.art-trace{stroke-dasharray:180;animation:trace 6s ease-in-out infinite}.art-signal{animation:signal 6s ease-in-out infinite}.art-bar{transform-box:fill-box;transform-origin:center bottom;animation:bars 6s ease-in-out infinite}.art-bar:nth-of-type(2){animation-delay:-2s}.art-bar:nth-of-type(3){animation-delay:-4s}.art-steam{stroke-dasharray:none;animation:steam 4s ease-out infinite}@keyframes trace{0%,8%{stroke-dashoffset:180;opacity:.35}45%,85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:.35}}@keyframes signal{0%,100%{opacity:.55}50%{opacity:1}}@keyframes bars{0%,100%{transform:scaleY(.82);opacity:.6}50%{transform:scaleY(1);opacity:1}}@keyframes steam{0%{transform:translateY(3px);opacity:0}30%{opacity:.8}100%{transform:translateY(-5px);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M13 59h70M18 16v43" stroke="var(--line,#2a3244)"/><rect class="art-bar" x="28" y="40" width="11" height="19" rx="3" fill="var(--surface-2,#1a2030)" stroke="var(--accent,#9cafff)"/><rect class="art-bar" x="46" y="28" width="11" height="31" rx="3" fill="var(--surface-2,#1a2030)" stroke="var(--accent,#9cafff)"/><rect class="art-bar art-signal" x="64" y="16" width="11" height="43" rx="3" fill="var(--surface-2,#1a2030)" stroke="var(--action,#d7f976)"/><path class="art-trace" d="m28 24 12-8 11 2" stroke="var(--accent,#9cafff)"/></svg>
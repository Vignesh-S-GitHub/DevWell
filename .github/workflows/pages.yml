name: Deploy DevWell to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build original installation icons
        run: npm run build:icons
      - name: Validate JavaScript and data model
        run: |
          node --check app.js
          node --check views.js
          node --check icons.js
          node --check motion.js
          node --check haptics.js
          node --check pulse.js
          node --check model.js
          node --check sw.js
          npm test
      - name: Verify browser flows and offline upgrades
        run: |
          python3 -m http.server 4173 > /tmp/devwell-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node --input-type=module -e "for(let i=0;i<20;i++){try{if((await fetch('http://127.0.0.1:4173')).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,200))}process.exit(1)"
          npm run test:browser
          npm run test:haptics
          npm run test:upgrade
      - name: Save screen previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-ui-previews
          path: test-results/
          if-no-files-found: ignore
      - name: Package app files
        run: |
          mkdir site
          cp index.html styles.css model.js icons.js haptics.js app.js views.js pulse.js motion.js sw.js manifest.webmanifest site/
          cp -R assets site/assets
          touch site/.nojekyll
      - name: Upload app
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Check published version and original assets
        env:
          DEVWELL_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          const base=process.env.DEVWELL_URL;
          for(let attempt=0;attempt<12;attempt++){
            const response=await fetch(base+'?release=3.1.2',{cache:'no-store'});
            const html=await response.text();
            if(response.ok&&html.includes('motion.js?v=3.1.2')&&html.includes('icons.js?v=3.1.2')){
              for(const path of ['icons.js?v=3.1.2','motion.js?v=3.1.2','haptics.js?v=3.1.2','assets/icon.svg','assets/icon-192.png','assets/icon-512.png','assets/icons/preview.html']){
                const asset=await fetch(new URL(path,base));
                if(!asset.ok)throw new Error('Missing published asset: '+path);
              }
              console.log('Published Pulse 3.1.2 and original logo/icon assets verified.');process.exit(0);
            }
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          throw new Error('Published version did not become available');
          NODE

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ed">
  <meta name="description" content="Find your healthier daily rhythm. Water, meals, movement, sleep and mindful breaks, together in DevWell.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="preload" href="./assets/fonts/outfit-variable.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./styles.css?v=2.0.0">
  <title>DevWell — Find your rhythm</title>
  <script src="./model.js?v=2.0.0" defer></script>
  <script src="./app.js?v=2.0.0" defer></script>
  <script src="./views.js?v=2.0.0" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="storageWarning" class="storage-warning hidden" role="alert">Your browser cannot save changes. Download a backup before closing this app.</div>
  <div id="updateNotice" class="update-notice hidden" role="status">A fresh DevWell is ready. <button onclick="location.reload()">Refresh app</button></div>
  <div class="shell">
    <header class="top">
      <a class="brand" href="#today" aria-label="DevWell home"><span class="logo" id="logo"></span>devwell<span class="brand-dot">.</span></a>
      <div class="top-date" id="topDate"></div>
      <div class="actions">
        <span class="connection" id="connection"></span>
        <button class="circle" id="theme" aria-label="Toggle theme"></button>
        <button class="circle" id="settings" aria-label="Settings"></button>
        <button class="add-button" onclick="quickLog()" aria-label="Log activity"><span id="addIcon"></span><span class="desktop-label">Log activity</span></button>
      </div>
    </header>
    <nav class="bottom" aria-label="Main navigation" id="nav"></nav>
    <main id="main" tabindex="-1"></main>
    <footer class="app-footer"><span>Made for your daily rhythm.</span><span>Private by design · On your device</span></footer>
  </div>
  <div class="toast hidden" id="toast" role="status"></div>
  <dialog id="dialog" aria-labelledby="dialogTitle"></dialog>
  <noscript>Enable JavaScript to use DevWell and keep track of your daily activities.</noscript>
</body>
</html>
